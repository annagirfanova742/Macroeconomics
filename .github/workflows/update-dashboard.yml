name: update-dashboard

on:
  schedule:
    - cron: "0 6 * * *"     # 09:00 МСК
    - cron: "0 15 * * *"    # 18:00 МСК
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "templates/**", "data/manual_overrides.csv", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore HTTP cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: httpcache-${{ github.run_id }}
          restore-keys: httpcache-

      - name: Fetch indicators
        run: python scripts/update_data.py

      - name: Build index.html
        run: python scripts/build_html.py

      - name: Commit data
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json index.html
          git diff --quiet --cached || git commit -m "data: $(date -u +'%F %T') UTC"
          git push

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp data/dashboard.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
